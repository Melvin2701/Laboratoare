<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L7_F – Garaj</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 30px; }
        input, button { font-size: 16px; padding: 6px 10px; margin: 3px; }
        table { border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid black; padding: 8px 14px; text-align: left; }
        th { background-color: #dddddd; }
    </style>
    <script>
        function citeste() {
            var text = localStorage.getItem("garaj");
            if (text === null) {
                return [];
            }
            return JSON.parse(text);
        }

        function salveazaGaraj(garaj) {
            localStorage.setItem("garaj", JSON.stringify(garaj));
        }

        function butonSterge(i) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = "Șterge";
            b.onclick = function () { stergeMasina(i); };
            return b;
        }

        function afiseaza() {
            var garaj = citeste();
            var corp = document.getElementById("corp");
            corp.innerHTML = "";

            for (var i = 0; i < garaj.length; i++) {
                var rand = document.createElement("tr");
                var campuri = [garaj[i].tip, garaj[i].model, garaj[i].culoare, garaj[i].anFab];

                for (var j = 0; j < campuri.length; j++) {
                    var celula = document.createElement("td");
                    celula.textContent = campuri[j];
                    rand.appendChild(celula);
                }

                var ultima = document.createElement("td");
                ultima.appendChild(butonSterge(i));
                rand.appendChild(ultima);

                corp.appendChild(rand);
            }

            document.getElementById("numar").textContent =
                "Număr de mașini în garaj: " + garaj.length;
        }

        function adauga() {
            var garaj = citeste();
            garaj.push({
                tip: document.getElementById("tip").value,
                model: document.getElementById("model").value,
                culoare: document.getElementById("culoare").value,
                anFab: Number(document.getElementById("an").value)
            });
            salveazaGaraj(garaj);
            document.getElementById("forma").reset();
            afiseaza();
            return false;                              
        }

        function stergeMasina(i) {
            var garaj = citeste();
            garaj.splice(i, 1);                         
            salveazaGaraj(garaj);
            afiseaza();
        }
    </script>
</head>
<body onload="afiseaza()">
    <h1>Garajul meu</h1>

    <form id="forma" onsubmit="return adauga()">
        <label for="tip">Tip</label> <input id="tip" required>
        <label for="model">Model</label> <input id="model" required>
        <label for="culoare">Culoare</label> <input id="culoare" required>
        <label for="an">An</label> <input id="an" type="number" min="1900" max="2100" required>
        <button type="submit">Adaugă</button>
    </form>

    <p id="numar"></p>

    <table>
        <thead>
            <tr><th>Tip</th><th>Model</th><th>Culoare</th><th>An</th><th></th></tr>
        </thead>
        <tbody id="corp"></tbody>
    </table>

    <p><a href="index.html">Înapoi la laboratorul 7</a></p>
</body>
</html>
