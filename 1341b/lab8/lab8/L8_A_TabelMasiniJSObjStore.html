<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L8_A – Tabel mașini (proprietăți separate)</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 30px; }
        input, button { font-size: 16px; padding: 6px 10px; margin: 3px; }
        table { border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid black; padding: 8px 14px; text-align: left; }
        th { background-color: #dddddd; }
        #mesaj { color: #b00020; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
    <h1>Tabel de mașini – trei chei în Local Storage</h1>

    <form onsubmit="return adaugaMasina()">
        <input id="marca" placeholder="Marca" required>
        <input id="model" placeholder="Model" required>
        <input id="culoare" placeholder="Culoare" required>
        <input id="anFab" type="number" placeholder="An fabricatie" required>
        <button type="submit">Adauga masina</button>
    </form>

    <p id="mesaj"></p> 

    <table id="tm">
        <tr>
            <th>Marca</th> <th>Model</th> <th>Culoare</th> <th>An fabricatie</th>
        </tr>
    </table>

    <p><a href="index.html">Înapoi la laboratorul 8</a></p>

    <script>
        var m1 = new masina("Opel", "Zafira", "gri", 2015);
        var m2 = new masina("Seat", "Ibiza", "roz", 2018);
        document.getElementById("tm").innerHTML += m1.randNou();
        document.getElementById("tm").innerHTML += m2.randNou();

        if (localStorage.marca) {
            var mSalvata = new masina(localStorage.marca, localStorage.model,
                                      localStorage.culoare, localStorage.anFab);
            document.getElementById("tm").innerHTML += mSalvata.randNou();
        }

        function masina(mk, md, cl, an) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;
            this.anFab = an;
            this.randNou = function () {
                return "<tr><td>" + esc(this.marca) + "</td><td>" + esc(this.model) +
                       "</td><td>" + esc(this.culoare) + "</td><td>" + esc(this.anFab) + "</td></tr>";
            };
        }

        function esc(t) {
            return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function valideaza(marca, model, culoare, an) {
            var anCurent = new Date().getFullYear();

            if (marca === "") {
                return "Marca nu poate fi goală.";
            }
            if (model === "") {
                return "Modelul nu poate fi gol.";
            }
            if (culoare === "") {
                return "Culoarea nu poate fi goală.";
            }
            if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
                return "Anul de fabricație trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
            }
            return "";
        }

        function adaugaMasina() {
            var marca = document.getElementById("marca").value.trim();
            var model = document.getElementById("model").value.trim();
            var culoare = document.getElementById("culoare").value.trim();
            var an = Number(document.getElementById("anFab").value);

            var eroare = valideaza(marca, model, culoare, an);
            if (eroare !== "") {
                document.getElementById("mesaj").textContent = eroare;   
                return false;
            }
            document.getElementById("mesaj").textContent = "";          
            var mNoua = new masina(marca, model, culoare, an);
            document.getElementById("tm").innerHTML += mNoua.randNou();

            localStorage.setItem("marca", marca);
            localStorage.setItem("model", model);
            localStorage.setItem("culoare", culoare);
            localStorage.setItem("anFab", an);

            return false;
        }
    </script>

    <!--
        Ex. 1 – ce se observă: cele două mașini din cod (Opel, Seat) apar mereu, pentru că sunt create
        la fiecare încărcare. Fiecare mașină adăugată se salvează în patru chei separate (marca, model,
        culoare, anFab), deci a doua o suprascrie pe prima: după reîncărcare, tabelul are doar ultima
        mașină adăugată. Atenție: cheia "model" este folosită și de L7_D din laboratorul 7 – pe același
        site, cele două pagini își suprascriu valoarea una alteia.

        Ex. 2: datele se introduc într-un formular; butonul "Adauga masina" este butonul de trimitere,
        iar funcția este apelată de onsubmit și se termină cu return false. Anul de fabricație este în
        formular, în tabel și în obiectul masina. Dacă în Local Storage există o mașină salvată fără
        anFab, celula anului afișează "undefined" – ștergeți cheile vechi din instrumentele dezvoltatorului.

        Ex. 3: valideaza() respinge câmpurile goale sau formate doar din spații (trim) și un an care nu
        este întreg între 1900 și anul curent (new Date().getFullYear()). La eroare, mașina nu se adaugă
        și nu se salvează, iar mesajul apare în <p id="mesaj">, nu într-un alert; la succes, mesajul se șterge.
    -->
</body>
</html>
