<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Pagina A1</title>
    <style>
        p {
            color: blue;
            background-color: #cccc00;
        }

        body {
            background-color: #ffffcc;
        }

        .center, p {
            text-align: center;
            color: red;
        }

        h1 {
            background-color: #00cc66;
            color: orange;
        }

        .center {
            font-variant: small-caps;
            
        }
    </style>
</head>
<body>
    <h1 class="center">Heading roșu centrat</h1>

    <p>Paragraf roșu centrat. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

    <p>
        <a href="Pagina_A2.html">Pagina 2</a><br>
        <a href="../index.html">Înapoi la Laboratorul 4</a>
    </p>

    <!--
        Linkul era scris href="Pagina_A2", fără extensie. Local nu există un fișier
        cu acest nume, deci nu funcționa; pe GitHub Pages ar fi mers, pentru că
        serverul completează extensia. Corect: href="Pagina_A2.html".

        Diferențele dintre Pagina_A1 și Pagina_A2:
        - titlul: în A1 este albastru pe verde, în A2 roșu fără fundal.
          În A1, .center { color: blue } este scrisă DUPĂ ".center, p { color: red }",
          deci la specificitate egală câștigă albastrul. În A2 ordinea este inversă,
          deci câștigă roșul. Fundalul verde vine din regula h1, care există doar în A1.
        - regula h1 { color: orange } din A1 nu are niciun efect: titlul are clasa
          center, iar orice regulă cu clasă bate o regulă cu tag, indiferent de ordine.
          Fundalul din aceeași regulă h1 se aplică totuși, pentru că nicio regulă
          cu clasă nu îl contrazice.
        - paragraful este identic în ambele pagini (roșu, centrat): ".center, p" este
          scrisă după "p { color: blue }", deci roșul câștigă.

        Modificarea pentru "Heading roșu centrat" și "Paragraf roșu centrat":
        am eliminat (comentat) color: blue din regula .center, astfel încât titlul
        să rămână roșu, cum cere ".center, p".
    -->
</body>
</html>
