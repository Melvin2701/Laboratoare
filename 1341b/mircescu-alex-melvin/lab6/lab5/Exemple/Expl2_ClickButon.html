<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Expl2 – click pe buton</title>
</head>
<body>
    <h1>Click pe buton</h1>
    <p id="demo">Acest paragraf se schimbă la apăsarea butonului.</p>
    <button onclick="document.getElementById('demo').style.color = 'green'; document.getElementById('demo').style.fontSize = '24px';">
        Schimbă paragraful
    </button>
    <p><a href="index.html">Înapoi la exemple</a></p>
</body>
</html>
