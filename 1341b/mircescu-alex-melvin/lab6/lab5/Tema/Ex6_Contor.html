<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Ex6 – contorul becului</title>
    <script>
        var contor = 0;                 

        function comuta() {
            var bec = document.getElementById("bec");
            console.log(bec.src);      

            if (bec.src.indexOf("stins") !== -1) {
                bec.src = "Bec%20aprins.gif";
                contor++;
                document.getElementById("contor").innerHTML =
                    "Becul a fost aprins de " + contor + " ori.";
            } else {
                bec.src = "Bec%20stins.gif";
            }
        }
    </script>
</head>
<body>
    <h1>Contorul becului</h1>
    <p>Fă clic pe bec: se aprinde, iar la următorul clic se stinge.</p>

    <img id="bec" src="Bec%20stins.gif" alt="Bec" onclick="comuta()">

    <p id="contor">Becul a fost aprins de 0 ori.</p>

    <p><a href="index.html">Înapoi la temă</a></p>
</body>
</html>
